# SonarCloud setup. token comes from Jenkins (credential "sonarcloud-token"), never from this file
sonar.projectKey=Sagar-nayar_medvault
sonar.organization=sagar-nayar
sonar.projectName=MedVault
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# what counts as source vs tests
sonar.sources=server,public/js
sonar.tests=tests
sonar.exclusions=node_modules/**,coverage/**,reports/**,public/css/**

# coverage comes from vitest (lcov). frontend is only smoke tested so its left out of the coverage %
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=public/**,server/index.js,tests/**,scripts/**

# eslint results show up inside sonar too
sonar.eslint.reportPaths=reports/eslint.json

# test data generator repeats the same shapes on purpose, dont count it as duplication
sonar.cpd.exclusions=server/seed.js
