# what prometheus scrapes and how often. short intervals so alerts show up fast in the demo
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: medvault-production
    static_configs:
      - targets: ["medvault-production:3000"]
        labels: { env: production }

  - job_name: medvault-staging
    static_configs:
      - targets: ["medvault-staging:3000"]
        labels: { env: staging }

  # outside-in check: hits /health like a user would (catches stuff /metrics wouldnt)
  - job_name: blackbox-production
    metrics_path: /probe
    params:
      module: [http_health]
    static_configs:
      - targets: ["http://medvault-production:3000/health"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # watching the pipeline itself (jenkins prometheus plugin)
  - job_name: jenkins
    metrics_path: /prometheus/
    scrape_interval: 30s
    static_configs:
      - targets: ["jenkins:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
