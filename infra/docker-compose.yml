# the CI/CD toolchain: jenkins + a private docker registry for build artefacts.
# start once with:  docker compose -f infra/docker-compose.yml up -d --build
name: devops
services:
  jenkins:
    build: ./jenkins
    image: medvault-jenkins:local
    container_name: jenkins
    # root is needed to use the docker socket on Docker Desktop.
    # fine for a local lab, in a real company you'd use a dedicated build agent instead
    user: root
    restart: unless-stopped
    ports: ["8080:8080"]
    env_file: .env
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false -Xmx768m"
      CASC_JENKINS_CONFIG: /usr/share/jenkins/casc/jenkins.yaml
      TRIVY_CACHE_DIR: /var/jenkins_home/.cache/trivy
      npm_config_cache: /var/jenkins_home/.npm
      SEMGREP_SEND_METRICS: "off"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 1600m
    networks: [devops-net]

  registry:
    image: registry:2.8.3
    container_name: registry
    restart: unless-stopped
    ports: ["5000:5000"]
    volumes: [registry_data:/var/lib/registry]
    mem_limit: 64m
    networks: [devops-net]

volumes:
  jenkins_home:
  registry_data:

networks:
  devops-net:
    name: devops-net
